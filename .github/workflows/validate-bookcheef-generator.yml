name: Validate BookCheef long-form generator

on:
  push:
    branches: [main]
    paths:
      - "scripts/generate-daily-book.mjs"
      - "scripts/book-checkpoint.mjs"
      - "scripts/book-checkpoint.test.mjs"
      - "scripts/deferred-task-policy.mjs"
      - "scripts/deferred-task-policy.test.mjs"
      - "book-publications/automation-config.json"
      - ".github/workflows/generate-daily-book.yml"
      - ".github/workflows/validate-bookcheef-generator.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check generator and checkpoint syntax
        run: |
          node --check scripts/generate-daily-book.mjs
          node --check scripts/book-checkpoint.mjs
          node --check scripts/deferred-task-policy.mjs
      - name: Exercise checkpoint save and recovery
        run: node --test scripts/book-checkpoint.test.mjs
      - name: Test deferred task priority and cooldown waiting
        run: node --test scripts/deferred-task-policy.test.mjs
      - name: Verify resumable checkpoint lifecycle
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const source = fs.readFileSync("scripts/generate-daily-book.mjs", "utf8");
            const workflow = fs.readFileSync(".github/workflows/generate-daily-book.yml", "utf8");
            const checkpoint = fs.readFileSync("scripts/book-checkpoint.mjs", "utf8");
            for (const token of ["createCheckpointStore", "await saveWork(pkg)", "runCursorAgent", "CURSOR_API_KEY", "saveOpenRouterCooldown", "saveCursorCooldown", "saveGeminiCooldown", "generateWithGemini", "generateWithFallback", "GEMINI_API_KEY", "GEMINI_COOLDOWN_PATH", "switching to the next AI provider", "DEFERRED_QUEUE_PATH", "deferredQueue.tasks.push", "Global publication rotation is left untouched until a book is verified as published.", "selectDeferredTask", "deferredSelection.status", "deferredTask", "candidate.endsWith(\":free\")", "Free-only policy blocked generation", "CURSOR_FREE_INCLUDED === \"true\""]) {
              if (!source.includes(token)) throw new Error("Missing generator feature: " + token);
            }
            for (const token of ["async function saveWork", "async function loadWork", "Resuming saved book", "version: 1"]) {
              if (!checkpoint.includes(token)) throw new Error("Missing checkpoint storage feature: " + token);
            }
            if (!workflow.includes("git add -A book-publications/work-in-progress") || !workflow.includes("book-publications/cursor-cooldown.json") || !workflow.includes("book-publications/gemini-cooldown.json") || !workflow.includes("book-publications/deferred-books.json") || !workflow.includes("git add book-publications/rotation-state.json")) throw new Error("Workflow does not persist checkpoint or provider cooldown state");
            const generationWorkflow = fs.readFileSync(".github/workflows/generate-daily-book.yml", "utf8");
            if (!generationWorkflow.includes("Install Cursor Agent fallback") || !generationWorkflow.includes("secrets.CURSOR_API_KEY") || !generationWorkflow.includes("vars.CURSOR_FREE_INCLUDED") || !generationWorkflow.includes("if: vars.CURSOR_FREE_INCLUDED")) throw new Error("Cursor fallback is not installed or authenticated in the generation workflow");
            if (!generationWorkflow.includes("secrets.GEMINI_API_KEY")) throw new Error("Gemini API key is not passed to the generation workflow");
            if (generationWorkflow.includes("actions/workflows/generate-daily-book.yml/dispatches")) throw new Error("Quota deferrals must not immediately dispatch another empty generation cycle.");
            if (!generationWorkflow.includes("scripts/openrouter-failure-policy.test.mjs")) throw new Error("Generation workflow does not run OpenRouter failover regression tests.");
            console.log("Checkpoint save/resume/persist/cleanup wiring is present.");
          '
      - name: Validate automation configuration
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const config = JSON.parse(fs.readFileSync("book-publications/automation-config.json", "utf8"));
            const length = config.daily_book.content_rules.reading_length;
            if (config.daily_book.free_only !== true || config.daily_book.paid_api_fallbacks !== false || config.daily_book.cursor_fallback_requires_explicit_included_free_entitlement !== true || config.daily_book.text_provider.free_models_only !== true) throw new Error("BookCheef must remain free-only");
            if (config.daily_book.on_failure.except_when_task_is_explicitly_deferred_after_free_provider_quota_exhaustion !== true) throw new Error("Deferred task rotation exception is not documented");
            if (config.daily_book.complete_deferred_task_before_starting_another !== true || config.daily_book.continue_with_next_book_task_when_available !== false) throw new Error("Generator must finish a deferred book before starting another.");
            if (length.adult_minimum_words < 18000) throw new Error("Adult minimum is below 18,000 words");
            if (length.adult_interactive_minimum_words_per_route !== 18000 || length.adult_interactive_minimum_words_per_scene !== 6000) throw new Error("Adult interactive routes must be at least 18,000 words with 6,000 words per scene.");
            const interactiveSceneMinimums = {"6+":500,"9+":600,"12+":800,"14+":900};
            for (const age of ["6+", "9+", "12+", "14+"]) {
              if (!length.child_minimum_words_by_age[age]) throw new Error("Missing child length for " + age);
              if (length.child_interactive_minimum_words_per_scene_by_age?.[age] !== interactiveSceneMinimums[age]) throw new Error("Interactive scene minimum is incorrect for " + age);
            }
            console.log("Reading-length policy is valid.");
          '
