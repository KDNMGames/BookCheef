name: Validate BookCheef long-form generator

on:
  push:
    branches: [main]
    paths:
      - "scripts/generate-daily-book.mjs"
      - "scripts/book-checkpoint.mjs"
      - "scripts/book-checkpoint.test.mjs"
      - "scripts/deferred-task-policy.mjs"
      - "scripts/deferred-task-policy.test.mjs"
      - "scripts/openrouter-failure-policy.mjs"
      - "scripts/openrouter-failure-policy.test.mjs"
      - "scripts/ordinary-book-structure.mjs"
      - "scripts/ordinary-book-structure.test.mjs"
      - "scripts/provider-quota-coordinator.mjs"
      - "scripts/provider-quota-coordinator.test.mjs"
      - "scripts/legacy-interactive-book.mjs"
      - "scripts/legacy-interactive-book.test.mjs"
      - "book-publications/automation-config.json"
      - ".github/workflows/generate-daily-book.yml"
      - ".github/workflows/validate-bookcheef-generator.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check generator and checkpoint syntax
        run: |
          node --check scripts/generate-daily-book.mjs
          node --check scripts/book-checkpoint.mjs
          node --check scripts/deferred-task-policy.mjs
          node --check scripts/openrouter-failure-policy.mjs
          node --check scripts/ordinary-book-structure.mjs
          node --check scripts/provider-quota-coordinator.mjs
          node --check scripts/legacy-interactive-book.mjs
      - name: Exercise checkpoint save and recovery
        run: node --test scripts/book-checkpoint.test.mjs
      - name: Test deferred task priority and cooldown waiting
        run: node --test scripts/deferred-task-policy.test.mjs
      - name: Test OpenRouter provider-specific failover and retry timing
        run: node --test scripts/openrouter-failure-policy.test.mjs
      - name: Test ordinary-book heading and illustration recovery
        run: node --test scripts/ordinary-book-structure.test.mjs
      - name: Test shared provider quota classification
        run: node --test scripts/provider-quota-coordinator.test.mjs
      - name: Test legacy interactive checkpoint migration
        run: node --test scripts/legacy-interactive-book.test.mjs
      - name: Verify resumable checkpoint lifecycle and free-only failover
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const source = fs.readFileSync("scripts/generate-daily-book.mjs", "utf8");
            const workflow = fs.readFileSync(".github/workflows/generate-daily-book.yml", "utf8");
            const checkpoint = fs.readFileSync("scripts/book-checkpoint.mjs", "utf8");
            for (const token of ["createCheckpointStore", "await saveWork(pkg)", "runCursorAgent", "CURSOR_API_KEY", "saveOpenRouterCooldown", "saveCursorCooldown", "saveGeminiCooldown", "saveGroqCooldown", "generateWithGemini", "generateWithGroq", "generateWithFallback", "GEMINI_API_KEY", "GROQ_API_KEY", "GROQ_COOLDOWN_PATH", "GEMINI_COOLDOWN_PATH", "switching to the next AI provider", "DEFERRED_QUEUE_PATH", "deferredQueue.tasks.push", "Global publication rotation is left untouched until a book is verified as published.", "selectDeferredTask", "deferredSelection.status", "deferredTask", "classifyOpenRouterFailure", "earliestRetryAfter", "normalizeOrdinaryBookStructure", "normalizeLegacyInteractivePackage", "selectOldestDeferredTaskAcrossWorkers", "withProviderQuota", "endsWith", "Free-only policy blocked generation", "generation_progress", "fragmentsPerChapter = Math.max(3", "fragmentsPerNode = 12", "minimumWordsPerRoute = 36000", "totalMinimum = 36000"]) {
              if (!source.includes(token)) throw new Error("Missing generator feature: " + token);
            }
            for (const token of ["async function saveWork", "async function loadWork", "Resuming saved book", "version: 1"]) {
              if (!checkpoint.includes(token)) throw new Error("Missing checkpoint storage feature: " + token);
            }
            if (!workflow.includes("git add -A -- book-publications") || !workflow.includes("Persist provider cooldown state")) throw new Error("Workflow does not persist resumable generation state");
            const quote = String.fromCharCode(39);
            if (!workflow.includes("CURSOR_FREE_INCLUDED: ${{ steps.cursor.outputs.available }}") || !workflow.includes("id: cursor") || !workflow.includes("skipping Cursor without blocking other free providers")) throw new Error("Cursor must be an optional fallback and must never block other providers when unavailable");
            if (!workflow.includes("GEMINI_FREE_INCLUDED: " + quote + "true" + quote) || !workflow.includes("secrets.GEMINI_API_KEY")) throw new Error("Gemini fallback must be explicitly configured as free-only");
            if (!workflow.includes("GROQ_FREE_INCLUDED: " + quote + "true" + quote) || !workflow.includes("secrets.GROQ_API_KEY")) throw new Error("Groq fallback must be explicitly configured as free-only and require a supplied secret");
            if (workflow.includes("actions/workflows/generate-daily-book.yml/dispatches")) throw new Error("Quota deferrals must not immediately dispatch another empty generation cycle.");
            if (!workflow.includes("scripts/openrouter-failure-policy.test.mjs")) throw new Error("Generation workflow does not run OpenRouter failover regression tests.");
            console.log("Three-hour fragment checkpoints, free-only failover and workflow persistence are wired.");
          '
      - name: Validate automation configuration
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const config = JSON.parse(fs.readFileSync("book-publications/automation-config.json", "utf8"));
            const length = config.daily_book.content_rules.reading_length;
            if (config.daily_book.free_only !== true || config.daily_book.paid_api_fallbacks !== false || config.daily_book.cursor_fallback_requires_explicit_free_entitlement !== true && config.daily_book.cursor_fallback_requires_explicit_included_free_entitlement !== true || config.daily_book.text_provider.free_models_only !== true || config.daily_book.text_provider.groq_fallback_requires_explicit_free_plan_key !== true) throw new Error("BookCheef must remain free-only");
            if (config.daily_book.on_failure.preserve_package_and_state !== true || config.daily_book.on_failure.do_not_publish_partial_book !== true) throw new Error("Failure recovery policy is unsafe");
            if (length.minimum_reading_minutes !== 180 || length.minimum_words_all_ages < 36000 || length.target_words_all_ages < 39000) throw new Error("Every book must target at least three hours / 36,000 words");
            if (length.ordinary_chapters !== 12 || length.ordinary_minimum_words_per_chapter < 3000) throw new Error("Ordinary long-form chapter policy is invalid");
            if (length.interactive_minimum_words_per_scene < 12000 || length.interactive_minimum_words_per_route < 36000) throw new Error("Interactive route policy is below three hours");
            console.log("Three-hour reading-length and free-only policies are valid.");
          '
