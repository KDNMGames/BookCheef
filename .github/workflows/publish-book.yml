name: Publish BookCheef book

on:
  push:
    branches: [main]
    paths:
      - "book-publications/inbox/*.json"
  workflow_dispatch:
    inputs:
      package_path:
        description: "Path to a publication JSON package"
        required: true
        default: "book-publications/inbox/sample.json"

permissions:
  contents: write
  actions: write

concurrency:
  group: bookcheef-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout publication package
        uses: actions/checkout@v4

      - name: Validate package, generate images and publish
        id: publish
        shell: bash
        env:
          PUBLISHER_URL: https://wendffewxxmnaglfksfg.supabase.co/functions/v1/book-publisher
          PUBLISHER_TOKEN: ${{ secrets.BOOK_PUBLISHER_TOKEN }}
          PACKAGE_PATH: ${{ github.event_name == 'workflow_dispatch' && inputs.package_path || '' }}
          GITHUB_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${PUBLISHER_TOKEN:-}" ]; then
            echo "::error::Repository secret BOOK_PUBLISHER_TOKEN is missing."
            exit 1
          fi

          if [ -n "${PACKAGE_PATH}" ]; then
            FILE="${PACKAGE_PATH}"
          else
            FILE="$(curl --fail --silent --show-error \
              --header "Authorization: Bearer ${GITHUB_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/KDNMGames/BookCheef/commits/${GITHUB_SHA}" | \
              jq -r '.files[]?.filename | select(test("^book-publications/inbox/[^/]+\\.json$"))' | head -n 1 || true)"
            if [ -z "${FILE}" ]; then
              echo "::error::The triggering commit did not identify a publication package."
              exit 1
            fi
          fi
          echo "Selected publication package: ${FILE}"

          if [ -z "${FILE}" ] || [ ! -f "${FILE}" ]; then
            echo "::error::No publication package JSON file found."
            exit 1
          fi
          export FILE

          BOOK_TITLE="$(node -e "const p=JSON.parse(require('fs').readFileSync(process.env.FILE,'utf8')); process.stdout.write(String(p.title || '').replace(/[\\r\\n]/g,' ').slice(0,180));")"
          echo "book_title=$BOOK_TITLE" >> "$GITHUB_OUTPUT"

          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import { findCommonsImageSet } from "./scripts/commons-image-fallback.mjs";
          const file = process.env.FILE;
          const payload = JSON.parse(fs.readFileSync(file, "utf8"));
          const qs = payload.reader_questions;
          const age = Number.parseInt(String(payload.age || "6+").replace(/[^0-9]/g, ""), 10) || 0;
          if (!payload.title || !payload.publication_key || !payload.book_content ||
              !(payload.cover?.prompt || payload.cover?.url || payload.cover?.base64) ||
              !Array.isArray(payload.illustrations) || payload.illustrations.length < 1 ||
              payload.illustrations.length > 5 ||
              payload.illustrations.some(i => (!(i.prompt || i.base64) || !i.chapter ||
                !Number.isInteger(Number(i.number)) || Number(i.number) < 1 || Number(i.number) > 5)) ||
              !Array.isArray(qs) || qs.length < 3 || qs.length > 5 ||
              qs.some(q => !q.question || !q.answer) ||
              (age >= 6 && !((payload.footnotes?.length || 0) > 0 ||
                (payload.interactive_content?.footnotes?.length || 0) > 0))) {
            throw new Error("Publication package validation failed");
          }

          const endpoint = process.env.PUBLISHER_URL;
          const token = process.env.PUBLISHER_TOKEN;
          const statusResponse = await fetch(endpoint, {
            method: "POST",
            headers: { "Content-Type": "application/json", "x-book-publisher-token": token },
            body: JSON.stringify({ action: "check_publication", publication_key: payload.publication_key })
          });
          const statusResult = await statusResponse.json().catch(() => ({}));
          if (!statusResponse.ok || !statusResult.ok) {
            throw new Error(`Could not verify publication status before image generation: HTTP ${statusResponse.status}`);
          }
          const alreadyPublished = statusResult.published === true;
          if (alreadyPublished) console.log("This publication key already exists in Supabase; skipping image generation.");

          const tasks = [];
          if (!alreadyPublished && payload.cover?.prompt && !payload.cover?.base64 && !payload.cover?.url) {
            tasks.push({ target: payload.cover, prompt: payload.cover.prompt, label: "cover" });
          }
          for (const item of payload.illustrations) {
            if (!alreadyPublished && item.prompt && !item.base64 && !item.url) {
              tasks.push({ target: item, prompt: item.prompt, label: `illustration ${item.number}` });
            }
          }
          if (tasks.length) {
            const wait = ms => new Promise(resolve => setTimeout(resolve, ms));

            async function generateOne(task, provider) {
              const send = async () => {
                const response = await fetch(endpoint, {
                  method: "POST",
                  headers: {
                    "Content-Type": "application/json",
                    "x-book-publisher-token": token
                  },
                  body: JSON.stringify({
                    action: "generate_image",
                    provider,
                    prompt: task.prompt
                  }),
                  signal: AbortSignal.timeout(90000)
                });
                const result = await response.json().catch(() => ({}));
                return { response, result };
              };
              let { response, result } = await send();
              if (provider === "ovh" && response.status === 429) {
                console.log("OVHcloud rate limit reached; waiting 65 seconds before one retry.");
                await wait(65000);
                ({ response, result } = await send());
              }
              if (!response.ok || !result.ok || !result.base64) {
                throw new Error(`${provider} failed for ${task.label}: HTTP ${response.status}; ${result.error || "no image returned"}`);
              }
              return { mime_type: result.mime_type, base64: result.base64 };
            }

            async function generateBatch(provider) {
              const images = [];
              for (let i = 0; i < tasks.length; i++) {
                if (provider === "ovh" && i > 0) {
                  // OVHcloud anonymous limit: 2 requests/minute/IP/model.
                  await wait(31000);
                }
                console.log(`Generating ${tasks[i].label} with ${provider} (${i + 1}/${tasks.length})`);
                images.push(await generateOne(tasks[i], provider));
              }
              return images;
            }

            let generated;
            let selectedProvider;
            try {
              generated = await generateBatch("cloudflare");
              selectedProvider = "Cloudflare Workers AI";
            } catch (cloudflareError) {
              console.log(`Cloudflare could not complete the full image set: ${cloudflareError.message}`);
              try {
                console.log("Restarting the complete image set with free OVHcloud SDXL to keep one consistent visual style.");
                generated = await generateBatch("ovh");
                selectedProvider = "OVHcloud AI Endpoints (free anonymous SDXL)";
              } catch (ovhError) {
                console.log(`OVHcloud could not complete the full image set: ${ovhError.message}`);
                console.log("Searching Wikimedia Commons for a complete set of verified CC0/Public Domain images with no attribution requirement.");
                generated = await findCommonsImageSet(tasks);
                selectedProvider = "Wikimedia Commons (verified CC0/Public Domain; no attribution required)";
              }
            }
            const extByMime = { "image/png": "png", "image/jpeg": "jpg", "image/webp": "webp", "image/gif": "gif" };
            for (let i = 0; i < tasks.length; i++) {
              const image = generated[i];
              const task = tasks[i];
              const suffix = task.label === "cover" ? "cover" : `illustration-${task.target.number}`;
              const extension = extByMime[image.mime_type];
              if (!extension) throw new Error(`Unsupported generated image type: ${image.mime_type}`);
              const path = `generated/${payload.publication_key}/${process.env.GITHUB_RUN_ID}-${process.env.GITHUB_RUN_ATTEMPT || "1"}/${suffix}.${extension}`;
              const uploadResponse = await fetch(endpoint, {
                method: "POST",
                headers: { "Content-Type": "application/json", "x-book-publisher-token": token },
                body: JSON.stringify({
                  action: "upload_image",
                  path,
                  mime_type: image.mime_type,
                  base64: image.base64
                }),
                signal: AbortSignal.timeout(60000)
              });
              const uploadResult = await uploadResponse.json().catch(() => ({}));
              if (!uploadResponse.ok || !uploadResult.ok || !uploadResult.url) {
                throw new Error(`Storage upload failed for ${task.label}: HTTP ${uploadResponse.status}; ${uploadResult.error || "no public URL"}`);
              }
              const check = await fetch(uploadResult.url, { method: "HEAD", signal: AbortSignal.timeout(30000) });
              if (!check.ok) throw new Error(`Uploaded image is not publicly accessible: ${task.label} (HTTP ${check.status})`);
              task.target.url = uploadResult.url;
              if (image.source) task.target.source_license = image.source;
              delete task.target.prompt;
              delete task.target.base64;
              delete task.target.mime_type;
              console.log(`Uploaded and verified ${task.label}.`);
            }
            console.log(`All ${generated.length} images generated with ${selectedProvider} and uploaded separately.`);
          } else {
            console.log("Package already contains image data or a cover URL; no generation needed.");
          }

          fs.writeFileSync("publication-payload.json", JSON.stringify(payload));
          fs.mkdirSync("book-publications/license-records", { recursive: true });
          const licensedAssets = [
            ...(payload.cover?.source_license ? [{ role: "cover", url: payload.cover.url, ...payload.cover.source_license }] : []),
            ...(payload.illustrations || []).filter(item => item.source_license).map(item => ({
              role: "illustration",
              number: item.number,
              chapter: item.chapter,
              url: item.url,
              ...item.source_license
            }))
          ];
          if (licensedAssets.length) {
            const safeKey = String(payload.publication_key).replace(/[^a-zA-Z0-9._-]/g, "-");
            fs.writeFileSync(
              "book-publications/license-records/" + safeKey + ".json",
              JSON.stringify({
                publication_key: payload.publication_key,
                recorded_at: new Date().toISOString(),
                policy: "Only machine-verified CC0/Public Domain files with no attribution requirement are accepted.",
                assets: licensedAssets
              }, null, 2) + "\n"
            );
            console.log("Saved a permanent license/provenance record for " + licensedAssets.length + " fallback image(s).");
          }
          NODE

          HTTP_STATUS="$(curl --silent --show-error --output response.json --write-out '%{http_code}' \
            --request POST "${PUBLISHER_URL}" \
            --header "Content-Type: application/json" \
            --header "x-book-publisher-token: ${PUBLISHER_TOKEN}" \
            --data-binary "@publication-payload.json")"

          if [ "${HTTP_STATUS}" -lt 200 ] || [ "${HTTP_STATUS}" -ge 300 ]; then
            echo "::error::Publisher returned HTTP ${HTTP_STATUS}:"
            cat response.json
            exit 1
          fi

          node -e "const r=JSON.parse(require('fs').readFileSync('response.json','utf8')); if(!r.ok) { console.error(r); process.exit(1); } console.log(JSON.stringify(r,null,2));"
          node scripts/verify-and-advance-book.mjs
          if ! git diff --quiet -- book-publications/rotation-state.json; then
            echo "newly_verified=true" >> "$GITHUB_OUTPUT"
            echo "A newly verified publication advanced the rotation; the next generation cycle may start."
            REPORT_TEXT="✅ BookCheef: книга «$BOOK_TITLE» опубликована. Проверка записи в Supabase, обложки, иллюстраций и содержимого успешно пройдена. https://kdnmgames.github.io/BookCheef/"
            if ! curl --fail-with-body --silent --show-error \
              -X POST \
              -H "Content-Type: application/json" \
              -H "x-bookcheef-report-token: $TELEGRAM_BOT_TOKEN" \
              https://wendffewxxmnaglfksfg.supabase.co/functions/v1/telegram-bot \
              -d "$(jq -n --arg text "$REPORT_TEXT" '{action:"admin_notification",text:$text}')"; then
              echo "::warning::Telegram publication report could not be delivered."
            fi
          else
            echo "newly_verified=false" >> "$GITHUB_OUTPUT"
            echo "This publication was already recorded; no duplicate generation dispatch will be sent."
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add book-publications/rotation-state.json book-publications/pending-publications.json book-publications/license-records/
          if ! git diff --cached --quiet; then
            git commit -m "Advance BookCheef rotation after verified publication"
            git push
          fi

      - name: Report publication failure to Telegram admins
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          BOOK_TITLE: ${{ steps.publish.outputs.book_title }}
        run: |
          set -euo pipefail
          TITLE="${BOOK_TITLE:-неизвестная книга}"
          MESSAGE="❌ BookCheef: публикация книги «$TITLE» прервана. Причина: ошибка на этапе проверки, загрузки изображений или записи в Supabase. Книга не считается опубликованной; подробности доступны в журнале GitHub Actions: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Content-Type: application/json" \
            -H "x-bookcheef-report-token: $TELEGRAM_BOT_TOKEN" \
            https://wendffewxxmnaglfksfg.supabase.co/functions/v1/telegram-bot \
            -d "$(jq -n --arg text "$MESSAGE" '{action:"admin_notification",text:$text}')"

      - name: Start the next generation cycle after verified publication
        if: steps.publish.outputs.newly_verified == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/KDNMGames/BookCheef/actions/workflows/generate-daily-book.yml/dispatches \
            -d '{"ref":"main"}'
          echo "Next BookCheef generation cycle dispatched after verified publication."
