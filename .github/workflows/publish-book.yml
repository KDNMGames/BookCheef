name: Publish BookCheef book

on:
  push:
    branches: [main]
    paths:
      - "book-publications/inbox/*.json"
  workflow_dispatch:
    inputs:
      package_path:
        description: "Path to a publication JSON package"
        required: true
        default: "book-publications/inbox/sample.json"

permissions:
  contents: read

concurrency:
  group: bookcheef-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout publication package
        uses: actions/checkout@v4

      - name: Validate package and publish
        shell: bash
        env:
          PUBLISHER_URL: https://wendffewxxmnaglfksfg.supabase.co/functions/v1/book-publisher
          PUBLISHER_TOKEN: ${{ secrets.BOOK_PUBLISHER_TOKEN }}
          PACKAGE_PATH: ${{ github.event_name == 'workflow_dispatch' && inputs.package_path || '' }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -z "${PUBLISHER_TOKEN:-}" ]; then
            echo "::error::Repository secret BOOK_PUBLISHER_TOKEN is missing."
            exit 1
          fi

          if [ -n "${PACKAGE_PATH}" ]; then
            FILE="${PACKAGE_PATH}"
          else
            FILE="$(curl --fail --silent --show-error \
              --header "Authorization: Bearer ${GITHUB_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/KDNMGames/BookCheef/commits/${GITHUB_SHA}" | \
              jq -r '.files[]?.filename | select(test("^book-publications/inbox/[^/]+\\.json$"))' | head -n 1 || true)"
            if [ -z "${FILE}" ]; then
              echo "::error::The triggering commit did not identify a publication package."
              exit 1
            fi
          fi
          echo "Selected publication package: ${FILE}"

          if [ -z "${FILE}" ] || [ ! -f "${FILE}" ]; then
            echo "::error::No publication package JSON file found."
            exit 1
          fi

          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync(process.argv[1],'utf8')); const qs=p.reader_questions; const age=Number.parseInt(String(p.age||'6+').replace(/[^0-9]/g,''),10)||0; if(!p.title || !p.publication_key || !p.book_content || !(p.cover?.prompt || p.cover?.url) || !Array.isArray(p.illustrations) || p.illustrations.length<1 || p.illustrations.length>5 || p.illustrations.some(i=>!i.prompt || !i.chapter || !Number.isInteger(Number(i.number)) || Number(i.number)<1 || Number(i.number)>5) || !Array.isArray(qs) || qs.length<3 || qs.length>5 || qs.some(q=>!q.question || !q.answer) || (age>=6 && !((p.footnotes?.length||0)>0 || (p.interactive_content?.footnotes?.length||0)>0))) process.exit(2);" "${FILE}"

          HTTP_STATUS="$(curl --silent --show-error --output response.json --write-out '%{http_code}' \
            --request POST "${PUBLISHER_URL}" \
            --header "Content-Type: application/json" \
            --header "x-book-publisher-token: ${PUBLISHER_TOKEN}" \
            --data-binary "@${FILE}")"

          if [ "${HTTP_STATUS}" -lt 200 ] || [ "${HTTP_STATUS}" -ge 300 ]; then
            echo "::error::Publisher returned HTTP ${HTTP_STATUS}:"
            cat response.json
            exit 1
          fi

          node -e "const r=JSON.parse(require('fs').readFileSync('response.json','utf8')); if(!r.ok) { console.error(r); process.exit(1); } console.log(JSON.stringify(r,null,2));"
