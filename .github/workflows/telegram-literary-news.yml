name: BookCheef literary news

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bookcheef-literary-news
  cancel-in-progress: false

jobs:
  publish-news:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Publish verified RSS news
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: "@BookCheef"
        run: node scripts/publish-literary-news.mjs

      - name: Save duplicate-prevention state
        run: |
          if git diff --quiet -- book-publications/telegram-news-state.json; then
            echo "No state changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add book-publications/telegram-news-state.json
          git commit -m "Update Telegram literary news history"
          git push
