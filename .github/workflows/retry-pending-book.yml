name: Retry pending BookCheef publication

on:
  push:
    branches: [main]
    paths:
      - "book-publications/retry-queue.json"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: bookcheef-publication-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout queue
        uses: actions/checkout@v4

      - name: Dispatch publisher for pending package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PACKAGE_PATH="$(node -e "const q=require('./book-publications/retry-queue.json'); process.stdout.write(q.package_path)")"
          test -n "$PACKAGE_PATH"
          node -e "if(!/^book-publications\/inbox\/[A-Za-z0-9._-]+\.json$/.test(process.argv[1])) process.exit(1)" "$PACKAGE_PATH"
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/KDNMGames/BookCheef/actions/workflows/publish-book.yml/dispatches \
            -d "{\"ref\":\"main\",\"inputs\":{\"package_path\":\"$PACKAGE_PATH\"}}"
          echo "Dispatched publisher for $PACKAGE_PATH"
