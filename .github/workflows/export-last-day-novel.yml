name: Export Last Day of the Universe novel

on:
  push:
    paths:
      - ".github/workflows/export-last-day-novel.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Add DeepSeek handoff notes
        run: |
          cat > book-publications/drafts/last-day-of-universe/DEEPSEEK_HANDOFF_RU.md <<'EOF'
          # Передача романа для продолжения в DeepSeek

          ## Паспорт проекта
          - Название: Последний день Вселенной
          - Авторский псевдоним: Лиор Эстен
          - Жанр: научная фантастика, космическая эпопея, философская фантастика
          - Возрастная маркировка: 16+
          - План: 5 томов, 160 глав, ориентир около 550 000 слов
          - Следующая глава по manifest: 26
          - Главы 1–25 сохранены в папке chapters; продолжать с главы 26.
          - Основной рассказчик: Илья Воронцов, первое лицо, прошедшее время.

          ## Завязка и обязательная концепция
          Единственный биологический человек пробуждается после криосна в чрезвычайно далёком будущем, где естественная жизнь исчезла, а сотни цивилизаций в итоге объединились в единый разум. Герой исследует гигантские структуры и следы цивилизаций, постепенно узнавая космическую историю. Вселенная неизбежно приближается к собственному финалу. Финал нельзя отменять или обходить: роман должен завершиться неизбежным угасанием/схлопыванием Вселенной.

          ## Структура пяти томов
          1. «Пробуждение в пустоте» — главы 1–32.
          2. «Архитектура вечности» — главы 33–64.
          3. «История единого разума» — главы 65–96.
          4. «Предвестие схлопывания» — главы 97–128.
          5. «Последний день» — главы 129–160.

          ## Правила непрерывности
          - Сначала внимательно прочитать manifest.json, outline.md и все файлы bible/.
          - Затем прочитать последние главы и review-файл перед написанием продолжения.
          - Не менять уже написанные главы задним числом без отдельного решения автора.
          - Соблюдать план главы 26 из outline.md и фиксировать новые факты в соответствующих заметках.
          - Лада не всеведущая; Единый не злодей. Их позиции могут расходиться.
          - Не вводить новую естественную биологическую жизнь в настоящем времени.
          - Не добавлять порталы, запасные вселенные, спасение от финала, сверхспособности или внезапные разгадки.
          - Не выдавать спекулятивную физику за установленный научный факт.
          - Не превращать главы в лекции: идеи раскрывать через сцены, диалоги, опыт и последствия.
          - Не повторять сцены и формулировки предыдущих глав.
          - Не публиковать роман до завершения всех 160 глав, проверки пяти томов, редакторской вычитки и финальной сборки.

          ## Точка продолжения
          По состоянию manifest.json завершены главы 1–25. Текущая следующая глава — 26. В томе I запланированы главы 1–32. Перед генерацией главы 26 сверь её точное задание с outline.md и событиями глав 23–25.

          ## Содержимое пакета
          - manifest.json — состояние проекта, структура, счётчики и список глав.
          - outline.md — подробный план всех 160 глав.
          - bible/ — персонажи, мир, стиль, хронология и сюжетные линии.
          - chapters/ — полный текст 25 написанных глав.
          - reviews/ — имеющиеся редакторские заметки.
          - volumes/ — паспорта и планы пяти томов.

          Этот пакет предназначен для ручного продолжения в DeepSeek. Автоматическая генерация BookCheef после экспорта должна быть отключена отдельно.
          EOF
      - name: Include dedicated author profile
        run: cp book-publications/authors/lior-esten.json book-publications/drafts/last-day-of-universe/author-profile-lior-esten.json
      - name: Package manuscript and project notes
        run: |
          cd book-publications/drafts
          zip -qr "$GITHUB_WORKSPACE/last-day-of-universe-deepseek.zip" last-day-of-universe
      - uses: actions/upload-artifact@v4
        with:
          name: last-day-of-universe-deepseek
          path: last-day-of-universe-deepseek.zip
          if-no-files-found: error
          retention-days: 90
