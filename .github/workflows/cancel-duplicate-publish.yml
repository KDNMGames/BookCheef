name: Cancel stalled BookCheef generation test

on:
  push:
    branches: [main]
    paths:
      - "book-publications/cancel-publish-run.json"

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-24.04
    steps:
      - name: Cancel stalled generation attempt
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: "42441402559"
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/KDNMGames/BookCheef/actions/runs/$RUN_ID/cancel"
          echo "Cancellation requested for stalled generation run $RUN_ID."
