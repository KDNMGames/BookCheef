name: BookCheef worker state tests

on:
  pull_request:
    paths:
      - "scripts/coordinate-worker-packages.mjs"
      - "scripts/coordinate-worker-packages.test.mjs"
      - "scripts/coordinate-worker-artifacts.mjs"
      - "scripts/coordinate-worker-artifacts.test.mjs"
      - "scripts/book-worker-mode.mjs"
      - "scripts/book-worker-mode.test.mjs"
      - "scripts/book-worker-state.mjs"
      - "scripts/book-worker-state.test.mjs"
      - "scripts/book-checkpoint.mjs"
      - "scripts/generate-daily-book.mjs"
      - "scripts/generate-next-novel-chapter.mjs"
      - ".github/workflows/generate-next-novel-chapter.yml"
      - ".github/workflows/generate-daily-book.yml"
      - ".github/workflows/generate-isolated-book-workers.yml"
      - "scripts/isolated-workflow.test.mjs"
      - ".github/workflows/test-book-workers.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  worker-state:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check scripts/coordinate-worker-packages.mjs
          node --check scripts/coordinate-worker-artifacts.mjs
          node --check scripts/isolated-workflow.test.mjs
          node --check scripts/book-worker-mode.mjs
          node --check scripts/book-worker-state.mjs
          node --check scripts/generate-daily-book.mjs
          node --check scripts/generate-next-novel-chapter.mjs
          node --check scripts/book-checkpoint.mjs
      - name: Run worker state tests
        run: node --test scripts/isolated-workflow.test.mjs scripts/book-worker-mode.test.mjs scripts/book-worker-state.test.mjs scripts/coordinate-worker-packages.test.mjs scripts/coordinate-worker-artifacts.test.mjs
