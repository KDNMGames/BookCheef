name: Test OpenRouter free text generation

on:
  push:
    branches: [main]
    paths:
      - "book-publications/automation-config.json"
      - ".github/workflows/test-text-ai-providers.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Test OpenRouter free model
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${OPENROUTER_API_KEY:-}" ]; then
            echo "::error::OPENROUTER_API_KEY secret is missing"
            exit 1
          fi

          code=$(curl --silent --show-error --output /tmp/openrouter.json --write-out "%{http_code}" \
            https://openrouter.ai/api/v1/chat/completions \
            --header "Authorization: Bearer $OPENROUTER_API_KEY" \
            --header "Content-Type: application/json" \
            --data '{"model":"openrouter/free","messages":[{"role":"user","content":"Ответь одним словом: ГОТОВО"}],"max_tokens":128}')

          if [ "$code" != "200" ]; then
            echo "::error::OpenRouter free-model request failed (HTTP $code)"
            python - <<'PY'
          import json
          try:
              d=json.load(open("/tmp/openrouter.json"))
              e=d.get("error", {})
              print("Provider error code:", e.get("code", "not reported") if isinstance(e,dict) else "not reported")
              print("Provider error message:", e.get("message", "not reported") if isinstance(e,dict) else str(e))
          except Exception:
              print("No JSON diagnostic returned.")
          PY
            exit 1
          fi

          python - <<'PY'
          import json
          d=json.load(open("/tmp/openrouter.json", encoding="utf-8"))
          choices=d.get("choices") or []
          if not choices:
              raise SystemExit("OpenRouter accepted the key but returned no choices")
          message=choices[0].get("message") or {}
          content=message.get("content")
          if isinstance(content, str):
              response=content.strip()
          elif isinstance(content, list):
              response=" ".join(str(part.get("text", "")) for part in content if isinstance(part, dict)).strip()
          else:
              response=""
          if not response and message.get("refusal"):
              response=str(message["refusal"]).strip()
          if not response and isinstance(message.get("reasoning"), str):
              response=message["reasoning"].strip()
          if not response:
              print("OpenRouter API key accepted.")
              print("Free model selected:", d.get("model", "not reported"))
              print("Finish reason:", choices[0].get("finish_reason", "not reported"))
              raise SystemExit("The model returned an empty text field; authentication succeeded, but text generation was not confirmed")
          print("OpenRouter API key accepted.")
          print("Free model selected:", d.get("model", "not reported"))
          print("Test response:", response[:500])
          print("Tokens used:", (d.get("usage") or {}).get("total_tokens", "not reported"))
          PY
