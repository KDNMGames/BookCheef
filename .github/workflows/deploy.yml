
name: Deploy BookCheef

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Private logo repository is accessed only when explicitly enabled.
      # DATABASE_REPO_TOKEN must be a fine-grained, read-only token.
      - name: Check out private branding assets
        if: ${{ vars.ENABLE_PRIVATE_BRANDING == 'true' }}
        uses: actions/checkout@v4
        with:
          repository: KDNMGames/BookCheef_DataBase
          ref: main
          token: ${{ secrets.DATABASE_REPO_TOKEN }}
          path: .private-brand-assets
          sparse-checkout: |
            Logos/SiteLogos
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Copy site favicon from private repository
        if: ${{ vars.ENABLE_PRIVATE_BRANDING == 'true' }}
        shell: bash
        run: |
          mkdir -p public
          if [ -f .private-brand-assets/Logos/SiteLogos/favicon.png ]; then
            cp .private-brand-assets/Logos/SiteLogos/favicon.png public/favicon.png
            echo "Private favicon copied into the public build."
          elif [ -f .private-brand-assets/Logos/SiteLogos/favicon.ico ]; then
            cp .private-brand-assets/Logos/SiteLogos/favicon.ico public/favicon.ico
            echo "Private favicon copied into the public build."
          else
            echo "::notice::No favicon file found; upload favicon.png or favicon.ico to Logos/SiteLogos."
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - name: Create SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
