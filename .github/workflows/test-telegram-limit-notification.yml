name: BookCheef Telegram limit notification test

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/test-telegram-limit-notification.yml

permissions:
  contents: read

jobs:
  telegram-test:
    runs-on: ubuntu-latest
    steps:
      - name: Send a harmless test notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const token = process.env.TELEGRAM_BOT_TOKEN;
          if (!token) {
            console.error("TELEGRAM_BOT_TOKEN GitHub Actions secret is missing.");
            process.exit(1);
          }
          const response = await fetch("https://wendffewxxmnaglfksfg.supabase.co/functions/v1/telegram-bot", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "x-bookcheef-report-token": token
            },
            body: JSON.stringify({
              action: "admin_notification",
              text: "🧪 ТЕСТ: уведомления о лимитах BookCheef работают. Это проверка доставки; лимиты провайдеров не затронуты."
            })
          });
          const result = await response.json().catch(() => ({}));
          console.log(JSON.stringify({ http_status: response.status, ok: result.ok, delivered: result.delivered, total: result.total }));
          if (!response.ok || result.ok !== true || !(result.delivered > 0)) {
            console.error("Telegram test notification was not confirmed as delivered. Check TELEGRAM_ADMIN_IDS in Supabase and the bot configuration.");
            process.exit(1);
          }
          NODE
