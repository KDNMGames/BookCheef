name: Test Cursor Cloud Agents API

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify Cursor API key and Cloud Agents access
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CURSOR_API_KEY:-}" ]; then
            echo "::error::CURSOR_API_KEY secret is missing"
            exit 1
          fi

          auth_args=(--user "$CURSOR_API_KEY:" --header "Accept: application/json")

          me_code=$(curl --silent --show-error --output /tmp/cursor-me.json --write-out "%{http_code}" "${auth_args[@]}" https://api.cursor.com/v1/me)
          if [ "$me_code" != "200" ]; then
            echo "::error::Cursor key identity check failed (HTTP $me_code)"
            python - <<'PY'
          import json
          try:
              d=json.load(open("/tmp/cursor-me.json"))
              print("Provider error:", d.get("error", d.get("message", "No safe error detail")))
              if isinstance(d.get("error"), dict):
                  print("Error code:", d["error"].get("code", "not reported"))
                  print("Error message:", d["error"].get("message", "not reported"))
          except Exception:
              print("No JSON diagnostic returned.")
          PY
            exit 1
          fi

          python - <<'PY'
          import json
          d=json.load(open("/tmp/cursor-me.json"))
          print("Cursor API key accepted.")
          print("Key name:", d.get("apiKeyName", "not reported"))
          print("Key type:", "user" if d.get("userId") is not None else "service-account")
          PY

          agents_code=$(curl --silent --show-error --output /tmp/cursor-agents.json --write-out "%{http_code}" "${auth_args[@]}" "https://api.cursor.com/v1/agents?limit=1")
          if [ "$agents_code" != "200" ]; then
            echo "::error::Cursor Cloud Agents access check failed (HTTP $agents_code)"
            python - <<'PY'
          import json
          try:
              d=json.load(open("/tmp/cursor-agents.json"))
              err=d.get("error", d.get("message", "No safe error detail"))
              if isinstance(err, dict):
                  print("Provider error code:", err.get("code", "not reported"))
                  print("Provider error message:", err.get("message", "not reported"))
              else:
                  print("Provider error:", err)
          except Exception:
              print("No JSON diagnostic returned.")
          PY
            exit 1
          fi

          python - <<'PY'
          import json
          d=json.load(open("/tmp/cursor-agents.json"))
          print("Cursor Cloud Agents API access confirmed.")
          print("Visible agents:", len(d.get("items", [])))
          PY
