name: Generate next Last Day of the Universe chapter

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: last-day-of-universe-writer
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout novel draft
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Cursor CLI
        run: |
          curl https://cursor.com/install -fsS | bash
          echo "$HOME/.cursor/bin" >> "$GITHUB_PATH"

      - name: Generate one chapter with Cursor Agent
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          CURSOR_MODEL: gpt-5
        run: node scripts/generate-next-novel-chapter.mjs

      - name: Commit generated draft and manifest
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add book-publications/drafts/last-day-of-universe/manifest.json book-publications/drafts/last-day-of-universe/chapters/
          if git diff --cached --quiet; then
            echo "No new chapter was generated."
            exit 1
          fi
          git commit -m "Write next chapter of Последний день Вселенной"
          git push
