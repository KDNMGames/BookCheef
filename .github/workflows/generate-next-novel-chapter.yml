name: Generate next Last Day of the Universe chapter

on:
  workflow_dispatch:
  schedule:
    # 02:10 Europe/Berlin in both CET and CEST; the second UTC slot is gated below.
    - cron: '10 0,1 * * *'

permissions:
  contents: write

concurrency:
  group: last-day-of-universe-writer
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout novel draft
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Europe/Berlin schedule
        id: local_schedule
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "schedule" && "$(TZ=Europe/Berlin date +%H)" != "02" ]]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping the duplicate UTC slot; Cursor runs once daily at 02:10 Europe/Berlin."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Require explicitly enabled included-free Cursor allowance
        if: steps.local_schedule.outputs.run == 'true'
        env:
          CURSOR_FREE_INCLUDED: ${{ vars.CURSOR_FREE_INCLUDED }}
        run: |
          if [ "$CURSOR_FREE_INCLUDED" != "true" ]; then
            echo "Stopped safely: novel generation requires explicit confirmation that Cursor Agent is covered by an included free allowance."
            exit 1
          fi

      - name: Install Cursor CLI
        if: steps.local_schedule.outputs.run == 'true'
        run: |
          curl https://cursor.com/install -fsS | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          agent --version

      - name: Generate one chapter with Cursor Agent
        if: steps.local_schedule.outputs.run == 'true'
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          CURSOR_FREE_INCLUDED: ${{ vars.CURSOR_FREE_INCLUDED }}
        run: node scripts/generate-next-novel-chapter.mjs

      - name: Commit generated draft and manifest
        if: steps.local_schedule.outputs.run == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add book-publications/drafts/last-day-of-universe/manifest.json book-publications/drafts/last-day-of-universe/chapters/ book-publications/workers/novel/
          if git diff --cached --quiet; then
            echo "No new chapter was generated."
            exit 1
          fi
          git commit -m "Write next chapter of Последний день Вселенной"
          git push
