name: Daily BookCheef book generation

on:
  schedule:
    # GitHub Actions minimum supported schedule interval: every 5 minutes.
    # Runs in UTC; provider quotas and the shared worker lease control actual generation throughput.
    - cron: "*/5 * * * *"
  push:
    branches: [main]
    paths:
      - "book-publications/run-daily-book.json"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: bookcheef-daily-book-generation
  cancel-in-progress: false

jobs:
  generate-or-resume:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout BookCheef
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Process confirmed full queue cleanup
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: node scripts/clear-generation-queue.mjs

      - name: Test isolated worker state
        run: node --test scripts/book-worker-state.test.mjs scripts/coordinate-worker-packages.test.mjs scripts/deferred-task-policy.test.mjs scripts/openrouter-failure-policy.test.mjs scripts/ordinary-book-structure.test.mjs scripts/provider-quota-coordinator.test.mjs scripts/legacy-interactive-book.test.mjs

      - name: Install Cursor CLI for the free-tier fallback
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$CURSOR_API_KEY" ]; then
            echo "CURSOR_API_KEY secret is missing; Cursor fallback will remain unavailable."
            exit 1
          fi
          curl https://cursor.com/install -fsS | bash
          # Cursor's Linux installer may expose the agent through ~/.local/bin;
          # retain ~/.cursor/bin as a compatibility location across installer versions.
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cursor/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$HOME/.cursor/bin:$PATH"
          AGENT_BIN="$(command -v agent || true)"
          if [ -z "$AGENT_BIN" ]; then
            echo "Cursor installer completed, but the agent executable was not found in ~/.local/bin or ~/.cursor/bin."
            find "$HOME/.local" "$HOME/.cursor" -type f -name agent -o -type l -name agent 2>/dev/null | head -20 || true
            exit 127
          fi
          echo "Cursor Agent executable: $AGENT_BIN"
          agent --version

      - name: Generate a book or resume the oldest pending package
        id: book
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Owner explicitly enabled Cursor fallback; usage is subject to the Cursor account's free limits.
          CURSOR_FREE_INCLUDED: 'true'
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Fail closed until the owner confirms this project's Gemini API Free Tier and no billing link.
          GEMINI_FREE_INCLUDED: 'true'
          GEMINI_MODEL: gemini-3.8-flash
          BOOKCHEEF_SHARED_QUOTA_ENABLED: ${{ vars.BOOKCHEEF_SHARED_QUOTA_ENABLED }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        shell: bash
        run: |
          set -o pipefail
          node scripts/generate-daily-book.mjs 2>&1 | tee generation.log

      - name: Coordinate worker package
        id: coordinate
        if: steps.book.outputs.package_path != ''
        env:
          COORDINATOR_PACKAGE_PATH: ${{ steps.book.outputs.package_path }}
        run: node scripts/coordinate-worker-packages.mjs

      - name: Release isolated worker lease
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import { createBookWorkerState } from "./scripts/book-worker-state.mjs";
          for (const workerType of ["ordinary", "interactive", "novel"]) {
            const worker = createBookWorkerState({ workerType, runId: process.env.GITHUB_RUN_ID });
            await worker.releaseLease();
          }
          NODE

      - name: Report generation workflow failure to Telegram admins
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          set -euo pipefail
          REASON="$(tail -n 10 generation.log 2>/dev/null | tr '\n' ' ' | cut -c1-1800 || true)"
          [ -n "$REASON" ] || REASON="GitHub Actions завершил один из этапов с ошибкой. Подробности — в журнале запуска."
          MESSAGE="❌ BookCheef: создание или подготовка книги прервано. Причина: $REASON"
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Content-Type: application/json" \
            -H "x-bookcheef-report-token: $TELEGRAM_BOT_TOKEN" \
            https://wendffewxxmnaglfksfg.supabase.co/functions/v1/telegram-bot \
            -d "$(jq -n --arg text "$MESSAGE" '{action:"admin_notification",text:$text}')"

      - name: Commit generated package
        if: steps.coordinate.outputs.package_path != ''
        env:
          PACKAGE_PATH: ${{ steps.coordinate.outputs.package_path }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$PACKAGE_PATH" book-publications/pending-publications.json book-publications/deferred-books.json
          git add -A book-publications/workers
          if ! git diff --cached --quiet; then
            git commit -m "Coordinate BookCheef worker publication package"
          fi
          git pull --rebase origin main
          git push

      - name: Persist provider cooldown state
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage the full automation state tree; optional provider files may not exist.
          git add -A -- book-publications
          if ! git diff --cached --quiet; then
            git commit -m "Record BookCheef provider cooldown"
            git pull --rebase origin main
            git push
          fi

      - name: Dispatch publisher
        if: steps.coordinate.outputs.package_path != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_PATH: ${{ steps.coordinate.outputs.package_path }}
        run: |
          set -euo pipefail
          test -n "$PACKAGE_PATH"
          node -e "if(!/^book-publications\\/inbox\\/[A-Za-z0-9._-]+\\.json$/.test(process.argv[1])) process.exit(1)" "$PACKAGE_PATH"
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/KDNMGames/BookCheef/actions/workflows/publish-book.yml/dispatches \
            -d "$(jq -n --arg package "$PACKAGE_PATH" '{ref:"main", inputs:{package_path:$package}}')"
          echo "Publisher dispatched for $PACKAGE_PATH"
