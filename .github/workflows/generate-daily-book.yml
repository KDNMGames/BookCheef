name: Daily BookCheef book generation

on:
  push:
    branches: [main]
    paths:
      - "book-publications/run-daily-book.json"
  # The single daily ChatGPT automation triggers this workflow by updating
  # book-publications/run-daily-book.json. Do not add a frequent cron here.
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: bookcheef-daily-book-generation
  cancel-in-progress: false

jobs:
  generate-or-resume:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout BookCheef
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test isolated worker state
        run: node --test scripts/book-worker-state.test.mjs scripts/coordinate-worker-packages.test.mjs

      - name: Install Cursor Agent fallback
        if: vars.CURSOR_FREE_INCLUDED == 'true'
        run: |
          curl https://cursor.com/install -fsS | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          agent --version

      - name: Generate a book or resume the oldest pending package
        id: book
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          CURSOR_FREE_INCLUDED: ${{ vars.CURSOR_FREE_INCLUDED }}
          CURSOR_MODEL: ${{ vars.CURSOR_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: node scripts/generate-daily-book.mjs

      - name: Coordinate worker package
        id: coordinate
        if: steps.book.outputs.package_path != ''
        env:
          COORDINATOR_PACKAGE_PATH: ${{ steps.book.outputs.package_path }}
        run: node scripts/coordinate-worker-packages.mjs

      - name: Release isolated worker lease
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import { createBookWorkerState } from "./scripts/book-worker-state.mjs";
          for (const workerType of ["ordinary", "interactive", "novel"]) {
            const worker = createBookWorkerState({ workerType, runId: process.env.GITHUB_RUN_ID });
            await worker.releaseLease();
          }
          NODE

      - name: Commit generated package
        if: steps.coordinate.outputs.package_path != ''
        env:
          PACKAGE_PATH: ${{ steps.coordinate.outputs.package_path }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$PACKAGE_PATH" book-publications/pending-publications.json book-publications/deferred-books.json
          git add -A book-publications/workers
          if ! git diff --cached --quiet; then
            git commit -m "Coordinate BookCheef worker publication package"
          fi
          git pull --rebase origin main
          git push

      - name: Persist provider cooldown state
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A book-publications/workers
          if [ -f book-publications/provider-cooldown.json ]; then
            git add book-publications/provider-cooldown.json
          fi
          if [ -f book-publications/cursor-cooldown.json ]; then
            git add book-publications/cursor-cooldown.json
          fi
          if [ -f book-publications/gemini-cooldown.json ]; then
            git add book-publications/gemini-cooldown.json
          fi
          if [ -f book-publications/deferred-books.json ]; then
            git add book-publications/deferred-books.json
          fi
          git add book-publications/rotation-state.json
          git add -A book-publications/work-in-progress
          if ! git diff --cached --quiet; then
            git commit -m "Record BookCheef provider cooldown"
            git pull --rebase origin main
            git push
          fi

      - name: Dispatch publisher
        if: steps.book.outputs.package_path != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_PATH: ${{ steps.coordinate.outputs.package_path }}
        run: |
          set -euo pipefail
          test -n "$PACKAGE_PATH"
          node -e "if(!/^book-publications\\/inbox\\/[A-Za-z0-9._-]+\\.json$/.test(process.argv[1])) process.exit(1)" "$PACKAGE_PATH"
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/KDNMGames/BookCheef/actions/workflows/publish-book.yml/dispatches \
            -d "$(jq -n --arg package "$PACKAGE_PATH" '{ref:"main", inputs:{package_path:$package}}')"
          echo "Publisher dispatched for $PACKAGE_PATH"
