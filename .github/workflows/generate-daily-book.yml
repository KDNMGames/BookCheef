name: Daily BookCheef book generation

on:
  push:
    branches: [main]
    paths:
      - "book-publications/run-daily-book.json"
  schedule:
    # Poll for the next production task every 15 minutes.
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: bookcheef-daily-book-generation
  cancel-in-progress: false

jobs:
  generate-or-resume:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout BookCheef
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate a book or resume the oldest pending package
        id: book
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: node scripts/generate-daily-book.mjs

      - name: Commit generated package
        if: steps.book.outputs.created == 'true'
        env:
          PACKAGE_PATH: ${{ steps.book.outputs.package_path }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$PACKAGE_PATH" book-publications/pending-publications.json
          git add -A book-publications/work-in-progress
          git commit -m "Create daily BookCheef book package"
          git pull --rebase origin main
          git push

      - name: Persist provider cooldown state
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f book-publications/provider-cooldown.json ]; then
            git add book-publications/provider-cooldown.json
          fi
          git add -A book-publications/work-in-progress
          if ! git diff --cached --quiet; then
            git commit -m "Record BookCheef provider cooldown"
            git pull --rebase origin main
            git push
          fi

      - name: Dispatch publisher
        if: steps.book.outputs.package_path != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_PATH: ${{ steps.book.outputs.package_path }}
        run: |
          set -euo pipefail
          test -n "$PACKAGE_PATH"
          node -e "if(!/^book-publications\\/inbox\\/[A-Za-z0-9._-]+\\.json$/.test(process.argv[1])) process.exit(1)" "$PACKAGE_PATH"
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/KDNMGames/BookCheef/actions/workflows/publish-book.yml/dispatches \
            -d "$(jq -n --arg package "$PACKAGE_PATH" '{ref:"main", inputs:{package_path:$package}}')"
          echo "Publisher dispatched for $PACKAGE_PATH"
