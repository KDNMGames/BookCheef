name: Generate Last Day of the Universe audiobooks

on:
  workflow_run:
    workflows: ["Deploy BookCheef"]
    types: [completed]
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/generate-last-day-universe-audio.yml"
      - "supabase/functions/book-audio/index.ts"

permissions:
  contents: read

concurrency:
  group: last-day-universe-audio-inspection
  cancel-in-progress: false

jobs:
  generate:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Generate up to eight pending chapters with safe retries
        shell: bash
        env:
          AUDIO_URL: https://wendffewxxmnaglfksfg.supabase.co/functions/v1/book-audio
          AUDIO_TOKEN: ${{ secrets.BOOK_PUBLISHER_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${AUDIO_TOKEN:-}" ]; then
            echo "::error::Repository secret BOOK_PUBLISHER_TOKEN is missing."
            exit 1
          fi

          completed=0
          max_chapters=1
          for ((i=1; i<=max_chapters; i++)); do
            success=false
            for attempt in 1 2 3; do
              status="$(curl --silent --show-error --output response.json --write-out '%{http_code}' \
                --request POST "${AUDIO_URL}" \
                --header "Content-Type: application/json" \
                --header "x-book-audio-publisher-token: ${AUDIO_TOKEN}" \
                --data '{"action":"inspect_series"}')"
              body="$(cat response.json)"
              if [ "${status}" -ge 200 ] && [ "${status}" -lt 300 ] && echo "${body}" | jq -e '.ok == true' >/dev/null 2>&1; then
                success=true
                break
              fi
              if [ "${status}" = "429" ] || echo "${body}" | jq -e '.rate_limited == true' >/dev/null 2>&1; then
                echo "Gemini free quota/rate limit reached. Stop safely; remaining chapters will retry on the next run."
                break 2
              fi
              if [ "${status}" -ge 500 ] && [ "${attempt}" -lt 3 ]; then
                echo "Temporary Gemini/worker error on attempt ${attempt}: ${body}"
                sleep $((attempt * 20))
                continue
              fi
              if echo "${body}" | jq -e '.retry_later == true' >/dev/null 2>&1; then
                echo "Temporary Gemini overload persists. Stop safely; remaining chapters will retry on the next scheduled run. Response: ${body}"
                break 2
              fi
              echo "::error::Audiobook worker returned HTTP ${status}: ${body}"
              exit 1
            done

            if [ "${success}" != true ]; then
              break
            fi
            if echo "${body}" | jq -e '.empty == true' >/dev/null 2>&1; then
              echo "No pending chapters remain for the series."
              break
            fi

            echo "Inspection response: ${body}"
          title="$(echo "${body}" | jq -r '.chapter_title // "Глава"')"
            chapter="$(echo "${body}" | jq -r '.chapter_index // 0')"
            model="$(echo "${body}" | jq -r '.model // "Gemini TTS"')"
            echo "Ready: ${title} (chapter ${chapter}), model: ${model}"
            completed=$((completed + 1))
            if [ "${i}" -lt "${max_chapters}" ]; then sleep 5; fi
          done
          echo "Audiobook chapters generated in this run: ${completed}"
