name: BookCheef provider quota coordinator tests

on:
  push:
    branches: [main]
    paths:
      - "scripts/generate-daily-book.mjs"
      - "scripts/ordinary-book-structure.mjs"
      - "scripts/ordinary-book-structure.test.mjs"
      - "scripts/provider-quota-coordinator.mjs"
      - "scripts/provider-quota-coordinator.test.mjs"
      - "book-publications/automation-config.json"
      - ".github/workflows/novel-artifact-coordinator-tests.yml"
  pull_request:
    paths:
      - "scripts/provider-quota-coordinator.mjs"
      - "scripts/provider-quota-coordinator.test.mjs"
      - "scripts/generate-daily-book.mjs"
      - "book-publications/automation-config.json"
      - "supabase/provider-quota-setup.sql"
      - "book-publications/PROVIDER-QUOTA-COORDINATOR.md"
      - ".github/workflows/generate-daily-book.yml"
      - ".github/workflows/novel-artifact-coordinator-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provider-quota:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax checks
        run: |
          node --check scripts/provider-quota-coordinator.mjs
          node --check scripts/provider-quota-coordinator.test.mjs
          node --check scripts/generate-daily-book.mjs
          node --check scripts/ordinary-book-structure.mjs
          node --check scripts/ordinary-book-structure.test.mjs
          node -e "JSON.parse(require('node:fs').readFileSync('book-publications/automation-config.json', 'utf8'))"
      - name: Run quota coordinator tests
        run: node --test scripts/provider-quota-coordinator.test.mjs
