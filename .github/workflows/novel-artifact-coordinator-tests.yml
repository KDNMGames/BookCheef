name: BookCheef novel artifact coordinator tests

on:
  pull_request:
    paths:
      - "scripts/coordinate-novel-artifacts.mjs"
      - "scripts/coordinate-novel-artifacts.test.mjs"
      - "scripts/provider-quota-coordinator.mjs"
      - "scripts/provider-quota-coordinator.test.mjs"
      - ".github/workflows/novel-artifact-coordinator-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  novel-coordinator:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax checks
        run: |
          node --check scripts/coordinate-novel-artifacts.mjs
          node --check scripts/coordinate-novel-artifacts.test.mjs
          node --check scripts/provider-quota-coordinator.mjs
          node --check scripts/provider-quota-coordinator.test.mjs
      - name: Run coordinator tests
        run: node --test scripts/coordinate-novel-artifacts.test.mjs scripts/provider-quota-coordinator.test.mjs
