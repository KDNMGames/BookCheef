name: Validate BookCheef licensed image fallback

on:
  push:
    branches: [main]
    paths:
      - "scripts/commons-image-fallback.mjs"
      - ".github/workflows/publish-book.yml"
      - ".github/workflows/validate-book-image-fallback.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check module syntax
        run: node --check scripts/commons-image-fallback.mjs

      - name: Verify real CC0/Public Domain search
        run: |
          node --input-type=module <<'NODE'
          import { findCommonsImage } from "./scripts/commons-image-fallback.mjs";
          const result = await findCommonsImage({
            label: "fallback smoke test",
            prompt: "red fox in a natural forest habitat"
          });
          if (!result.base64 || !result.mime_type || result.source?.attribution_required !== false ||
              result.source?.commercial_use !== true || !/public domain|cc0/i.test(result.source?.license_name || "")) {
            throw new Error("The Commons fallback did not return a verified no-attribution commercial-use image.");
          }
          console.log(JSON.stringify({
            provider: result.source.provider,
            license: result.source.license_name,
            attribution_required: result.source.attribution_required,
            commercial_use: result.source.commercial_use,
            bytes: Buffer.from(result.base64, "base64").length
          }, null, 2));
          NODE
