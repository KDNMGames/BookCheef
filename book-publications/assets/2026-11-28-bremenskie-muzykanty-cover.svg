<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1350" viewBox="0 0 900 1350" role="img" aria-labelledby="title desc">
<title id="title">Бременские музыканты — обложка</title>
<desc id="desc">Четверо сказочных животных стоят друг на друге перед освещённым окном лесного дома в ночном лесу.</desc>
<defs>
  <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#050913"/><stop offset=".48" stop-color="#142437"/><stop offset="1" stop-color="#03060c"/>
  </linearGradient>
  <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
    <stop stop-color="#243342"/><stop offset="1" stop-color="#070b11"/>
  </linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#fff0b0"/><stop offset=".38" stop-color="#d9a64d"/><stop offset=".72" stop-color="#85501f"/><stop offset="1" stop-color="#f6d88c"/>
  </linearGradient>
  <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#69462c"/><stop offset=".5" stop-color="#241a17"/><stop offset="1" stop-color="#0b1017"/>
  </linearGradient>
  <linearGradient id="donkey" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#c1c0b5"/><stop offset=".5" stop-color="#777e82"/><stop offset="1" stop-color="#353f49"/>
  </linearGradient>
  <linearGradient id="dog" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#c18a50"/><stop offset=".55" stop-color="#76502f"/><stop offset="1" stop-color="#30231d"/>
  </linearGradient>
  <linearGradient id="cat" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#d8c6a0"/><stop offset=".55" stop-color="#8c7862"/><stop offset="1" stop-color="#332c2a"/>
  </linearGradient>
  <radialGradient id="moon">
    <stop stop-color="#fff6d8" stop-opacity=".95"/><stop offset=".42" stop-color="#d7c08d" stop-opacity=".34"/><stop offset="1" stop-color="#b6a16e" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="window">
    <stop stop-color="#fff2b0"/><stop offset=".45" stop-color="#e6a84d"/><stop offset="1" stop-color="#a44d1c" stop-opacity=".12"/>
  </radialGradient>
  <filter id="softGlow"><feGaussianBlur stdDeviation="26"/></filter>
  <filter id="smallGlow"><feGaussianBlur stdDeviation="8"/></filter>
</defs>
