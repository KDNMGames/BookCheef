<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1350" viewBox="0 0 900 1350">
<defs>
 <linearGradient id="wall" x2="0" y2="1"><stop stop-color="#d0bea0"/><stop offset="1" stop-color="#74614f"/></linearGradient>
 <linearGradient id="dusk" x2="0" y2="1"><stop stop-color="#536879"/><stop offset=".55" stop-color="#bd8a70"/><stop offset="1" stop-color="#293d3b"/></linearGradient>
 <linearGradient id="floor" x2="0" y2="1"><stop stop-color="#6d4e39"/><stop offset="1" stop-color="#2a201c"/></linearGradient>
</defs>
<rect width="900" height="1350" fill="#171b1c"/>
<rect x="30" y="30" width="840" height="1290" fill="none" stroke="#b58b58" stroke-width="5"/>
<rect x="48" y="48" width="804" height="1254" fill="none" stroke="#6c563e" stroke-width="2"/>
<text x="450" y="145" text-anchor="middle" fill="#ead4ad" font-family="Georgia,serif" font-size="76" letter-spacing="8">ОТКРЫТОЕ</text>
<text x="450" y="230" text-anchor="middle" fill="#ead4ad" font-family="Georgia,serif" font-size="76" letter-spacing="8">ОКНО</text>
<text x="450" y="285" text-anchor="middle" fill="#b9976b" font-family="Georgia,serif" font-size="27" letter-spacing="8">САКИ</text>
<!-- room -->
<rect x="90" y="340" width="720" height="670" fill="url(#wall)" stroke="#a98a61" stroke-width="8"/>
<path d="M90 875h720v135H90Z" fill="url(#floor)"/>
<!-- window opening and dusk garden -->
<rect x="270" y="390" width="365" height="480" fill="url(#dusk)" stroke="#4b3a2c" stroke-width="22"/>
<circle cx="540" cy="515" r="58" fill="#e8bd91" opacity=".75"/>
<path d="M270 740q90-130 180-50t185-30v210H270Z" fill="#405b4b"/>
<path d="M270 800q90-85 180-30t185-20v120H270Z" fill="#263f36"/>
<g fill="#192e29"><path d="M300 720l40-210 40 210Zm270 0 35-240 42 240Z"/></g>
<!-- open casements -->
<path d="M270 390L125 455v400l145 15Z" fill="#574536" stroke="#b58d5c" stroke-width="14"/>
<path d="M635 390l145 65v400l-145 15Z" fill="#574536" stroke="#b58d5c" stroke-width="14"/>
<path d="M145 480l100-45v370l-100-35Zm615 0-100-45v370l100-35Z" fill="#8b7153" stroke="#d0b17d" stroke-width="7"/>
<!-- book on sill -->
<path d="M330 875q80-35 150 0v70q-70-35-150 0Z" fill="#c8b28e" stroke="#544230" stroke-width="5"/>
<path d="M480 875q75-35 145 0v70q-70-35-145 0Z" fill="#e4d2ae" stroke="#544230" stroke-width="5"/>
<path d="M480 875v70" stroke="#715b43" stroke-width="4"/>
