<path d="M670 850l45-90 45 90Z" fill="#d9b67b" stroke="#49382a" stroke-width="6"/>
<path d="M680 845h70" stroke="#f5d9a0" stroke-width="6"/>
<!-- small spaniel silhouette in garden -->
<g fill="#151d1a"><ellipse cx="480" cy="805" rx="38" ry="22"/><circle cx="515" cy="790" r="19"/><path d="M448 820l-10 35m48-35 8 35m-60-45q-35-35-45-5" stroke="#151d1a" stroke-width="12" fill="none"/></g>
<text x="450" y="1100" text-anchor="middle" fill="#e6d1ae" font-family="Georgia,serif" font-size="31" font-style="italic">История о доверчивости</text>
<text x="450" y="1150" text-anchor="middle" fill="#e6d1ae" font-family="Georgia,serif" font-size="31" font-style="italic">и неожиданной выдумке</text>
<text x="450" y="1245" text-anchor="middle" fill="#b58b58" font-family="Georgia,serif" font-size="24" letter-spacing="7">КЛАССИКА АНГЛИЙСКОЙ ПРОЗЫ</text>
</svg>